<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tết Trung Thu 🏮</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, #0d1b3e 0%, #050d1a 40%, #020810 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent),
                radial-gradient(1px 1px at 200px 60px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 250px 20px, #fff, transparent),
                radial-gradient(2px 2px at 300px 90px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 350px 50px, #fff, transparent),
                radial-gradient(1px 1px at 400px 30px, rgba(255,255,255,0.8), transparent);
            background-size: 400px 100px;
            animation: twinkleStars 4s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes twinkleStars {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            display: block;
            position: relative;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }

        .guide {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px black;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 15px 30px;
            border-radius: 15px;
            line-height: 1.8;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 100, 0.2);
        }

        button {
            pointer-events: auto;
            cursor: pointer;
            background: linear-gradient(to bottom, #FF8C00, #CC6600);
            color: #FFF;
            border: 2px solid #FFD700;
            padding: 15px 50px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.6);
            animation: pulse 1.5s infinite;
            display: block;
            margin: 0 auto;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        #camera-preview {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 120px;
            border: 2px solid rgba(255, 200, 100, 0.5);
            transform: scaleX(-1);
            opacity: 0.8;
            border-radius: 10px;
            background: #000;
        }

        #copyright {
            position: absolute;
            bottom: 5px;
            right: 15px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 100;
            font-family: sans-serif;
            pointer-events: none;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div class="guide">
            ❤️ <b>2 Tay (Tim):</b> Love<br>
            ✊ <b>Nắm đấm:</b> Đèn lồng &nbsp;|&nbsp; 🖐 <b>Xòe tay:</b> Trăng tròn &nbsp;|&nbsp; 👌 <b>OK:</b> Zoom Photo<br>
            <b>3 Ngón:</b> Bánh TT &nbsp;|&nbsp; ☝️ <b>1 Ngón:</b> Rước đèn &nbsp;|&nbsp; ✌️ <b>2 Ngón:</b> Sít rịt &nbsp;|&nbsp; 🤘 <b>Rock:</b> Múa Lân
        </div>
        <button id="btnStart" onclick="startSystem()">🏮 BẮT ĐẦU 🏮</button>
    </div>

    <div id="copyright">© Khai Hoan</div>

    <div id="selectedPhoto" style="position: absolute; bottom: 100px; width: 100%; text-align: center; color: rgba(255,255,255,0.8); font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px black; display: none;">Ảnh 1 được chọn</div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        const MUSIC_URL = "./audio.mp3";
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true; bgMusic.volume = 1.0;

        const loader = new THREE.TextureLoader();
        const photoFiles = [
            './image1.jpg',
            './image2.jpg',
            './image3.jpg',
            './image4.jpg',
            './image5.jpg',
        ];
        const photoTextures = [];
        photoFiles.forEach((f, i) => photoTextures[i] = loader.load(f));

        function createCustomTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const cx = 32, cy = 32;

            const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
            if (type === 'gold_glow') {
                grd.addColorStop(0, '#FFFFFF'); grd.addColorStop(0.4, '#FFA500'); grd.addColorStop(1, 'rgba(0,0,0,0)');
            } else if (type === 'red_light') {
                grd.addColorStop(0, '#FFCCAA'); grd.addColorStop(0.4, '#FF4500'); grd.addColorStop(1, 'rgba(0,0,0,0)');
            } else if (type === 'gift') {
                grd.addColorStop(0, '#FFAAAA'); grd.addColorStop(0.4, '#FF2200'); grd.addColorStop(1, 'rgba(0,0,0,0)');
            }
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const textures = {
            gold: createCustomTexture('gold_glow'),
            red: createCustomTexture('red_light'),
            gift: createCustomTexture('gift')
        };

        // Firefly texture
        function createFireflyTexture() {
            const cvs = document.createElement('canvas'); cvs.width = 64; cvs.height = 64;
            const ctx = cvs.getContext('2d');
            const grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 28);
            grd.addColorStop(0, 'rgba(255,240,150,1)');
            grd.addColorStop(0.4, 'rgba(255,200,50,0.7)');
            grd.addColorStop(1, 'rgba(255,150,0,0)');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 64, 64);
            const t = new THREE.CanvasTexture(cvs); t.needsUpdate = true; return t;
        }
        textures.firefly = createFireflyTexture();

        const CONFIG = {
            goldCount: 2200,
            redCount: 400,
            giftCount: 200,
            treeHeight: 70,
            treeBaseRadius: 35,
            fireflyCount: 700
        };

        // Hand control sensitivity: increase to make horizontal hand movement more responsive
        // Set to 1.5× of the original 4.0 -> 6.0
        const HAND_SENSITIVITY = 12.0; // tăng gấp 2 lần khi xòe tay
        const HAND_LERP = 0.1; // smoothing factor for following the hand (0..1)

        let scene, camera, renderer;
        let groupGold, groupRed, groupGift;
        let photoMeshes = [];
        let frameMeshes = [];
        let titleMesh, starMesh, loveMesh, cntt7Mesh;
        let fireflySystem; // firefly particle system

        let state = 'TREE';
        let selectedIndex = 0;
        let handX = 0.5; // normalized hand X position (0-1) used for rotation

        // --- SHAPE MATH ---
        function getANHYEUEMPoint() {
            const char = Math.floor(Math.random() * 8);
            let x = 0, y = 0, z = 0;
            const t = Math.random();
            switch (char) {
                case 0: // A
                    // Vị trí x trung tâm khoảng -70
                    if (t < 0.4) { x = -75 + t / 0.4 * 5; y = -10 + t / 0.4 * 20; } // Nét lên
                    else if (t < 0.8) { x = -70 + (t - 0.4) / 0.4 * 5; y = 10 - (t - 0.4) / 0.4 * 20; } // Nét xuống
                    else { x = -72.5 + (t - 0.8) / 0.2 * 5; y = 0; } // Gạch ngang
                    break;
                case 1: // N
                    // Vị trí x trung tâm khoảng -50
                    if (t < 0.33) { x = -55; y = -10 + (t / 0.33) * 20; } // Lên
                    else if (t < 0.66) { x = -55 + ((t - 0.33) / 0.33) * 10; y = 10 - ((t - 0.33) / 0.33) * 20; } // Chéo xuống
                    else { x = -45; y = -10 + ((t - 0.66) / 0.34) * 20; } // Lên
                    break;
                case 2: // H
                    // Vị trí x trung tâm khoảng -30
                    if (t < 0.33) { x = -35; y = 10 - (t / 0.33) * 20; } // Cột trái
                    else if (t < 0.66) { x = -25; y = 10 - ((t - 0.33) / 0.33) * 20; } // Cột phải
                    else { x = -35 + ((t - 0.66) / 0.34) * 10; y = 0; } // Gạch giữa
                    break;
                case 3: // Y
                    // Vị trí x trung tâm khoảng -10
                    if (t < 0.33) { x = -15 + (t / 0.33) * 5; y = 10 - (t / 0.33) * 10; } // Chéo trái
                    else if (t < 0.66) { x = -5 - ((t - 0.33) / 0.33) * 5; y = 10 - ((t - 0.33) / 0.33) * 10; } // Chéo phải
                    else { x = -10; y = ((t - 0.66) / 0.34) * -10; } // Chân
                    break;
                case 4: // E
                    // Vị trí x trung tâm khoảng 10
                    if (t < 0.3) { x = 5; y = 10 - (t / 0.3) * 20; } // Cột dọc
                    else if (t < 0.55) { x = 5 + ((t - 0.3) / 0.25) * 10; y = 10; } // Ngang trên
                    else if (t < 0.8) { x = 5 + ((t - 0.55) / 0.25) * 8; y = 0; } // Ngang giữa
                    else { x = 5 + ((t - 0.8) / 0.2) * 10; y = -10; } // Ngang dưới
                    break;
                case 5: // U
                    // Vị trí x trung tâm khoảng 30
                    if (t < 0.33) { x = 25; y = 10 - (t / 0.33) * 20; } // Xuống trái
                    else if (t < 0.66) { x = 25 + ((t - 0.33) / 0.33) * 10; y = -10; } // Đáy ngang
                    else { x = 35; y = -10 + ((t - 0.66) / 0.34) * 20; } // Lên phải
                    break;
                case 6: // E
                    // Vị trí x trung tâm khoảng 50 (Copy logic chữ E trên và cộng thêm offset X)
                    if (t < 0.3) { x = 45; y = 10 - (t / 0.3) * 20; }
                    else if (t < 0.55) { x = 45 + ((t - 0.3) / 0.25) * 10; y = 10; }
                    else if (t < 0.8) { x = 45 + ((t - 0.55) / 0.25) * 8; y = 0; }
                    else { x = 45 + ((t - 0.8) / 0.2) * 10; y = -10; }
                    break;
                case 7: // M
                    // Vị trí x trung tâm khoảng 70
                    if (t < 0.25) { x = 65; y = -10 + (t / 0.25) * 20; } // Lên trái
                    else if (t < 0.5) { x = 65 + ((t - 0.25) / 0.25) * 5; y = 10 - ((t - 0.25) / 0.25) * 10; } // Xuống giữa
                    else if (t < 0.75) { x = 70 + ((t - 0.5) / 0.25) * 5; y = ((t - 0.5) / 0.25) * 10; } // Lên phải
                    else { x = 75; y = 10 - ((t - 0.75) / 0.25) * 20; } // Xuống phải
                    break;
            }
            x *= 1.0;
            x *= 1.25;
            y *= 1.25;
            return { x, y, z: (Math.random() - 0.5) * 2 };
        }

        function getLionPoint() {
            const r = Math.random();
            let x, y, z;
            if (r < 0.6) {
                const ang = Math.random() * Math.PI * 2;
                const rad = 20 + Math.random() * 15;
                x = Math.cos(ang) * rad; y = Math.sin(ang) * rad; z = (Math.random() - 0.5) * 10;
            } else if (r < 0.9) {
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const rad = 18 * Math.pow(Math.random(), 0.3);
                x = rad * Math.sin(phi) * Math.cos(theta);
                y = rad * Math.sin(phi) * Math.sin(theta);
                z = rad * Math.cos(phi) + 5;
            } else {
                if (Math.random() > 0.5) { x = (Math.random() > 0.5 ? 8 : -8) + (Math.random() - 0.5) * 2; y = 5; z = 20; }
                else { x = 0; y = -5; z = 22; }
            }
            return { x, y, z };
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0); // nền trong suốt
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            groupGold = createParticleSystem('gold', CONFIG.goldCount, 2.0);
            groupRed = createParticleSystem('red', CONFIG.redCount, 3.5);
            groupGift = createParticleSystem('gift', CONFIG.giftCount, 3.0);

            createPhotos();
            createDecorations();
            createFireflies();
            animate();
        }

        function createParticleSystem(type, count, size) {
            const pPositions = [];
            const pTree = [], pHeart = [], pExplode = [], pGift = [], pUniverse = [], pCNTT7 = [], pLion = [];
            const sizes = [], phases = [];

            for (let i = 0; i < count; i++) {
                // Lantern shape
                const rnd = Math.random();
                let lx, ly, lz;
                if (rnd < 0.78) {
                    // Main body - ellipsoid with sine profile
                    const t = Math.random();
                    const lanternH = CONFIG.treeHeight * 0.65;
                    const profile = Math.sin(t * Math.PI);
                    const maxR = CONFIG.treeBaseRadius * 0.65;
                    const radius = profile * maxR;
                    const theta = Math.random() * Math.PI * 2;
                    const fillR = radius * ((type === 'gold') ? Math.sqrt(Math.random()) : 0.9 + Math.random() * 0.1);
                    lx = fillR * Math.cos(theta);
                    lz = fillR * Math.sin(theta);
                    ly = t * lanternH - lanternH / 2;
                } else if (rnd < 0.9) {
                    // Bottom tassel/fringe
                    const theta = Math.random() * Math.PI * 2;
                    const spread = 1 + Math.random() * 4;
                    lx = Math.cos(theta) * spread * ((type === 'gold') ? Math.random() : 0.5);
                    lz = Math.sin(theta) * spread * ((type === 'gold') ? Math.random() : 0.5);
                    ly = -CONFIG.treeHeight * 0.33 - Math.random() * 12;
                } else {
                    // Top handle arc
                    const angle = Math.random() * Math.PI;
                    const handleR = 5 + Math.random() * 3;
                    lx = Math.cos(angle) * handleR;
                    ly = CONFIG.treeHeight * 0.33 + Math.sin(angle) * 6;
                    lz = (Math.random() - 0.5) * 2;
                }
                pTree.push(lx, ly, lz);

                // Heart
                const tH = Math.random() * Math.PI * 2;
                let hx = 16 * Math.pow(Math.sin(tH), 3), hy = 13 * Math.cos(tH) - 5 * Math.cos(2 * tH) - 2 * Math.cos(3 * tH) - Math.cos(4 * tH);
                const rFill = Math.pow(Math.random(), 0.3);
                pHeart.push(hx * rFill * 2.2, hy * rFill * 2.2 + 5, (Math.random() - 0.5) * 10);

                // Explode
                const phi = Math.acos(2 * Math.random() - 1), lam = Math.random() * Math.PI * 2;
                const rad = 65 * Math.cbrt(Math.random());
                pExplode.push(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));

                // Gift
                const side = 40, axis = Math.floor(Math.random() * 3);
                let gx = (Math.random() - 0.5) * side, gy = (Math.random() - 0.5) * side, gz = (Math.random() - 0.5) * side;
                if (axis === 0) gx = (Math.random() > 0.5 ? 1 : -1) * side / 2; else if (axis === 1) gy = (Math.random() > 0.5 ? 1 : -1) * side / 2; else gz = (Math.random() > 0.5 ? 1 : -1) * side / 2;
                pGift.push(gx * (0.9 + Math.random() * 0.2), gy * (0.9 + Math.random() * 0.2), gz * (0.9 + Math.random() * 0.2));

                // Universe
                const arm = i % 3, spin = Math.random() * 3 * Math.PI, dist = spin * 5;
                pUniverse.push(Math.cos(spin + (Math.PI * 2 / 3) * arm) * dist, (Math.random() - 0.5) * (100 - dist) / 5, Math.sin(spin + (Math.PI * 2 / 3) * arm) * dist);

                // CNTT7 & Lion
                const ptC = getANHYEUEMPoint(), ptL = getLionPoint();
                pCNTT7.push(ptC.x, ptC.y, ptC.z); pLion.push(ptL.x, ptL.y, ptL.z);

                pPositions.push(pTree[i * 3], pTree[i * 3 + 1], pTree[i * 3 + 2]);
                sizes.push(size); phases.push(Math.random() * Math.PI * 2);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            const colors = new Float32Array(count * 3);
            const baseColor = new THREE.Color(type === 'gold' ? 0xFFA500 : (type === 'red' ? 0xFF4500 : 0xFF6B35));
            for (let i = 0; i < count; i++) { colors[i * 3] = baseColor.r; colors[i * 3 + 1] = baseColor.g; colors[i * 3 + 2] = baseColor.b; }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            geo.userData = {
                tree: pTree, heart: pHeart, explode: pExplode, gift: pGift, universe: pUniverse, cntt7: pCNTT7, lion: pLion,
                phases: phases, baseColor: baseColor, baseSize: size
            };

            const mat = new THREE.PointsMaterial({
                size: size, map: textures[type], transparent: true, opacity: 1.0,
                vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
            });
            scene.add(new THREE.Points(geo, mat));
            return scene.children[scene.children.length - 1];
        }

        function createPhotos() {
             const geo = new THREE.PlaneGeometry(8, 8);
            for (let i = 0; i < 5; i++) {
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide }));
                mesh.visible = false; mesh.scale.set(0, 0, 0);
                scene.add(mesh); photoMeshes.push(mesh);

                const frameGeo = new THREE.PlaneGeometry(9, 9);
                const frameMat = new THREE.MeshBasicMaterial({ color: 0xFF8C00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.visible = false;
                scene.add(frame); frameMeshes.push(frame);
            }
        }

        function createDecorations() {
            function txtTex(t, s, c) {
                const cvs = document.createElement('canvas'); cvs.width = 1024; cvs.height = 256;
                const ctx = cvs.getContext('2d'); ctx.font = `bold italic ${s}px "Times New Roman"`; ctx.fillStyle = c;
                ctx.textAlign = 'center'; ctx.shadowColor = "#FFF"; ctx.shadowBlur = 20; ctx.fillText(t, 512, 150);
                return new THREE.CanvasTexture(cvs);
            }
            titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 15), new THREE.MeshBasicMaterial({ map: txtTex("TRUNG THU VUI VẺ", 90, '#FFD700'), transparent: true, blending: THREE.AdditiveBlending }));
            titleMesh.position.set(0, 50, 0); scene.add(titleMesh);

            const moonCvs = document.createElement('canvas'); moonCvs.width = 128; moonCvs.height = 128;
            const mCtx = moonCvs.getContext('2d');
            const moonGlow = mCtx.createRadialGradient(64, 64, 25, 64, 64, 64);
            moonGlow.addColorStop(0, 'rgba(255,235,160,1)');
            moonGlow.addColorStop(0.4, 'rgba(255,210,100,0.8)');
            moonGlow.addColorStop(0.7, 'rgba(255,180,50,0.3)');
            moonGlow.addColorStop(1, 'rgba(255,150,0,0)');
            mCtx.fillStyle = moonGlow;
            mCtx.fillRect(0, 0, 128, 128);
            mCtx.beginPath();
            mCtx.arc(64, 64, 32, 0, Math.PI * 2);
            mCtx.fillStyle = '#FFE4A0';
            mCtx.fill();
            mCtx.beginPath(); mCtx.arc(52, 55, 5, 0, Math.PI * 2); mCtx.fillStyle = 'rgba(200,170,80,0.3)'; mCtx.fill();
            mCtx.beginPath(); mCtx.arc(72, 48, 3, 0, Math.PI * 2); mCtx.fill();
            mCtx.beginPath(); mCtx.arc(62, 72, 4, 0, Math.PI * 2); mCtx.fill();
            starMesh = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(moonCvs), transparent: true, blending: THREE.AdditiveBlending }));
            starMesh.position.set(0, CONFIG.treeHeight / 2 + 5, 0); scene.add(starMesh);

            loveMesh = new THREE.Mesh(new THREE.PlaneGeometry(70, 18), new THREE.MeshBasicMaterial({ map: txtTex("I Love Youuuuuuu ❤️", 100, '#FF69B4'), transparent: true, blending: THREE.AdditiveBlending }));
            loveMesh.position.set(0, -20, 20); loveMesh.visible = false; scene.add(loveMesh);

            cntt7Mesh = new THREE.Mesh(new THREE.PlaneGeometry(50, 12), new THREE.MeshBasicMaterial({ map: txtTex("Tran Thi Ngoc Huyen", 100, '#00FFFF'), transparent: true, blending: THREE.AdditiveBlending }));
            cntt7Mesh.position.set(0, -30, 0); cntt7Mesh.visible = false; scene.add(cntt7Mesh);
        }

        // --- Fireflies ---
        function createFireflies() {
            const count = CONFIG.fireflyCount;
            const positions = new Float32Array(count * 3);
            const speeds = new Float32Array(count);
            const phases = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 300;
                positions[i * 3 + 1] = Math.random() * 200 - 60;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 300;
                speeds[i] = 0.1 + Math.random() * 0.4;
                phases[i] = Math.random() * Math.PI * 2;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));
            geo.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
            const mat = new THREE.PointsMaterial({
                size: 2.5,
                map: textures.firefly,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });
            fireflySystem = new THREE.Points(geo, mat);
            fireflySystem.frustumCulled = false;
            scene.add(fireflySystem);
        }

        function updateParticleGroup(group, targetState, speed, time, handRotY) {
            const attr = group.geometry.attributes;
            const positions = attr.position.array, colors = attr.color.array, sizes = attr.size.array;
            const u = group.geometry.userData;

            let key = 'tree';
            if (targetState === 'HEART') key = 'heart';
            else if (targetState === 'EXPLODE' || targetState === 'PHOTO') key = 'explode';
            else if (targetState === 'GIFT') key = 'gift';
            else if (targetState === 'UNIVERSE') key = 'universe';
            else if (targetState === 'ANHYEUEM') key = 'cntt7';
            else if (targetState === 'LION') key = 'lion';

            let targets = u[key];
            for (let i = 0; i < positions.length; i++) positions[i] += (targets[i] - positions[i]) * speed;
            attr.position.needsUpdate = true;

            // Rotation & Effects
            if (targetState === 'UNIVERSE') { group.rotation.y -= 0.002; group.rotation.z = Math.sin(time * 0.5) * 0.2; }
            else if (targetState === 'GIFT') { group.rotation.y += 0.01; group.rotation.x = Math.sin(time) * 0.1; }
            else if (targetState === 'TREE') { group.rotation.y += 0.005; group.rotation.x = 0; group.rotation.z = 0; }
            else if (targetState === 'EXPLODE') {
                // follow hand horizontal position smoothly
                group.scale.set(1,1,1);
                // smoother and configurable follow using HAND_LERP
                group.rotation.y = THREE.MathUtils.lerp(group.rotation.y, handRotY, HAND_LERP);
            } else { group.rotation.y *= 0.95; group.rotation.x *= 0.95; group.rotation.z *= 0.95; }

            const count = positions.length / 3;
            for (let i = 0; i < count; i++) {
                let b = 0.8 + 0.4 * Math.sin(time * (key === 'explode' ? 15 : 5) + u.phases[i]);
                if (targetState === 'HEART' || targetState === 'CNTT7') b = 1.0;
                colors[i * 3] = u.baseColor.r * b; colors[i * 3 + 1] = u.baseColor.g * b; colors[i * 3 + 2] = u.baseColor.b * b;
                sizes[i] = u.baseSize;
            }
            attr.color.needsUpdate = true; attr.size.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001, speed = (state === 'ANHYEUEM') ? 0.03 : 0.06;
            const handRotY = (handX - 0.5) * HAND_SENSITIVITY; // convert normalized handX to rotation target (sensitivity applied)
            updateParticleGroup(groupGold, state, speed, time, handRotY);
            updateParticleGroup(groupRed, state, speed, time, handRotY);
            updateParticleGroup(groupGift, state, speed, time, handRotY);

            // Hiệu ứng đập đập cho trái tim
            if (state === 'HEART' || state === 'ANHYEUEM') {
                const beat = 1 + 0.1 * Math.sin(time * 6); // Đập nhanh
                groupGold.scale.setScalar(beat);
                groupRed.scale.setScalar(beat);
                groupGift.scale.setScalar(beat);
                loveMesh.scale.setScalar(beat);
            } else {
                groupGold.scale.setScalar(1);
                groupRed.scale.setScalar(1);
                groupGift.scale.setScalar(1);
                loveMesh.scale.setScalar(1);
            }

            titleMesh.visible = (state === 'TREE'); starMesh.visible = (state === 'TREE');
            loveMesh.visible = (state === 'HEART'); cntt7Mesh.visible = (state === 'ANHYEUEM');

            if (state === 'EXPLODE') {
                frameMeshes.forEach(f => f.visible = false);
                titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = false;
                const baseAngle = groupGold.rotation.y;
                const angleStep = (Math.PI * 2) / 5;
                let bestIdx = 0; let maxZ = -999;
                photoMeshes.forEach((mesh, i) => {
                    mesh.visible = true;
                    const angle = baseAngle + i * angleStep;
                    const x = Math.sin(angle) * CONFIG.treeBaseRadius * 0.85;
                    const z = Math.cos(angle) * CONFIG.treeBaseRadius * 0.85;
                    const y = Math.sin(time + i) * 3;
                    mesh.position.lerp(new THREE.Vector3(x, y, z), 0.1);
                    mesh.lookAt(camera.position);
                    frameMeshes[i].position.copy(mesh.position);
                    frameMeshes[i].rotation.copy(mesh.rotation);
                    frameMeshes[i].lookAt(camera.position);
                    if (z > maxZ) { maxZ = z; bestIdx = i; }
                    if (z > 5) {
                        const ds = 1.0 + (z/(CONFIG.treeBaseRadius*0.85))*0.8;
                        mesh.scale.lerp(new THREE.Vector3(ds, ds, ds), 0.1);
                    } else {
                        mesh.scale.lerp(new THREE.Vector3(0.6, 0.6, 0.6), 0.1);
                    }
                });
                selectedIndex = bestIdx;
                frameMeshes.forEach((f, i) => f.visible = (i === bestIdx));

            } else if (state === 'PHOTO') {
                photoMeshes.forEach((mesh, i) => {
                    mesh.rotation.set(0, 0, 0);
                    mesh.visible = true;
                    if (i === selectedIndex) {
                        mesh.position.lerp(new THREE.Vector3(0, 0, 60), 0.1); mesh.scale.lerp(new THREE.Vector3(6, 6, 6), 0.1);
                    } else mesh.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1);
                });
            } else photoMeshes.forEach(m => { m.visible = false; m.scale.set(0, 0, 0); });
            frameMeshes.forEach(f => f.visible = false);

            // --- Firefly update ---
            if (fireflySystem) {
                const pos = fireflySystem.geometry.attributes.position.array;
                const spd = fireflySystem.geometry.attributes.speed.array;
                const phs = fireflySystem.geometry.attributes.phase.array;
                const count = pos.length / 3;
                for (let i = 0; i < count; i++) {
                    const ix = i * 3, iy = ix + 1, iz = ix + 2;
                    pos[iy] += spd[i] * 0.3;
                    pos[ix] += Math.sin(time * 0.5 + phs[i]) * 0.15;
                    pos[iz] += Math.cos(time * 0.3 + phs[i] * 1.5) * 0.1;
                    if (pos[iy] > 120) {
                        pos[iy] = -60 - Math.random() * 30;
                        pos[ix] = (Math.random() - 0.5) * 300;
                        pos[iz] = (Math.random() - 0.5) * 300;
                    }
                }
                fireflySystem.geometry.attributes.position.needsUpdate = true;
                fireflySystem.material.opacity = 0.6 + 0.4 * Math.abs(Math.sin(time * 2));
                fireflySystem.rotation.y += 0.0003;
            }

            renderer.render(scene, camera);
        }

        function startSystem() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play().catch(e => console.log(e));
            init3D();

            const video = document.getElementsByClassName('input_video')[0];
            const canvas = document.getElementById('camera-preview');
            const ctx = canvas.getContext('2d');

            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults(results => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

                if (results.multiHandLandmarks.length === 0) { state = 'TREE'; return; }

                // 1. Two Hands Check -> HEART
                if (results.multiHandLandmarks.length === 2) {
                    const h1 = results.multiHandLandmarks[0], h2 = results.multiHandLandmarks[1];
                    const distIndex = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
                    const distThumb = Math.hypot(h1[4].x - h2[4].x, h1[4].y - h2[4].y);
                    if (distIndex < 0.15 && distThumb < 0.15) { state = 'HEART'; return; }
                }

                // 2. One Hand Logic
                const lm = results.multiHandLandmarks[0];
                handX = lm[9].x; // update horizontal hand position for rotation control

                // const cameraLeft = window.innerWidth - 15 - 160;
                // document.getElementById('photoFrame').style.left = (cameraLeft + selectedIndex * 32) + 'px';
                // document.getElementById('photoFrame').style.display = 'block';

                // Finger States (Open if Tip Y < PIP Y) - Note: Y is inverted in screen coords? No, 0 is top.
                // So if tip is higher (smaller y) than pip, it's extended.
                const isExt = (tip, pip) => lm[tip].y < lm[pip].y;

                const idx = isExt(8, 6), mid = isExt(12, 10), ring = isExt(16, 14), pinky = isExt(20, 18);


                // A. Pinch (Photo)
                const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                if (pinchDist < 0.05) {
                    state = 'PHOTO';
                    return;
                }

                // B. Gestures based on extensions

                // Fist: No fingers extended
                    // Fist: All fingers coiled (not extended)
                    if (!idx && !mid && !ring && !pinky) { state = 'TREE'; return; }

                // Open: All extended
                if (idx && mid && ring && pinky) { state = 'EXPLODE'; return; }

                // Point: Only Index
                if (idx && !mid && !ring && !pinky) { state = 'UNIVERSE'; return; }

                // Victory: Index & Middle
                if (idx && mid && !ring && !pinky) { state = 'ANHYEUEM'; return; }

                // Rock: Index & Pinky
                if (idx && !mid && !ring && pinky) { state = 'LION'; return; }

                // Gift: three fingers (Index + Middle + Ring) extended, Pinky not extended
                if (idx && mid && ring && !pinky) { state = 'GIFT'; return; }

                // Default fallbacks to avoid sticking
                // If somewhat closed -> Tree
                // If somewhat open -> Explode
            });

            const cameraUtils = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); }, width: 320, height: 240
            });
            cameraUtils.start();
        }

        window.addEventListener('resize', () => {
            if (camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });
    </script>
